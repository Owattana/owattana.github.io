<style>
  html, body { margin: 0; height: 100%; background: #f6f5ef; overflow: hidden; }
  @media (prefers-color-scheme: dark) { html, body { background: #141511; } }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  noscript a { display: block; padding: 40px 16px; text-align: center; font: 18px sans-serif; color: #5c6f3c; }
</style>

<body>
<!-- ระบบจริงอยู่ที่ Google Apps Script · หน้านี้แค่เปิดระบบไว้ข้างใน เพื่อไม่ให้มีแถบเตือนของ Google -->
<iframe id="app" title="ร้านหนังสือ อ.วัฒนา" allow="camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen; web-share" allowfullscreen></iframe>
<noscript><a href="https://script.google.com/macros/s/AKfycbyRZud_oLzofhFdF4ik5w57EGjLry-vWZyM1CPYOhH_sOe-LfzhYz5rGljybj-if9Ei/exec">แตะที่นี่เพื่อเปิดระบบ</a></noscript>
<script>
  var EXEC = 'https://script.google.com/macros/s/AKfycbyRZud_oLzofhFdF4ik5w57EGjLry-vWZyM1CPYOhH_sOe-LfzhYz5rGljybj-if9Ei/exec';
  var FORCE = {};   // ค่าที่ต้องใส่เสมอ
  var DEFAULT = {}; // ค่าเริ่มต้น (ถ้าลิงก์ไม่ได้ส่งมา)
  var p = new URLSearchParams(location.search);
  for (var k in DEFAULT) if (!p.has(k)) p.set(k, DEFAULT[k]);
  for (var k2 in FORCE) p.set(k2, FORCE[k2]);
  var q = p.toString();
  document.getElementById('app').src = EXEC + (q ? '?' + q : '');
</script>
